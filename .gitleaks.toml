# Secret scanning configuration.
#
# The allowlist below is deliberately narrow. Excluding whole directories, the
# usual shortcut, would mean a credential genuinely pasted into a README or an
# example went unreported, and those are exactly the places where one gets
# pasted. So instead of trusting paths, this file trusts one documented
# placeholder shape and nothing else.

title = "n0passtemps"

[extend]
useDefault = true

[allowlist]
description = """
The documented placeholder for a bearer credential.

Every example in the repository writes a credential as a selector beginning
EXAMPLEONLY followed by a verifier that is plain text, for instance
npt_EXAMPLEONLY0000.EXAMPLE-NOT-A-REAL-KEY. A real verifier is 27 base64url
characters, so a token in this shape cannot be a credential, whereas any other
token-shaped string anywhere in the tree is still reported.
"""

# Matches the placeholder and nothing else. The verifier half must contain a
# hyphen, which base64url does use, but combined with the EXAMPLE- prefix and
# the EXAMPLEONLY selector there is no overlap with a generated token.
regexes = [
  '''np[ta]_EXAMPLEONLY[0-9]{4}\.EXAMPLE-NOT-A-REAL-(KEY|TOKEN)''',

  # The placeholder shape used before the convention above was settled. These
  # exact values appear in the history and nowhere in the working tree. They
  # were never credentials: each decodes to the words foobarbaz and quux, and
  # none is the 20 bytes a verifier holds. They are listed by value rather than
  # by commit so that a history scan stays meaningful, and so that a real
  # credential committed in the same range would still be reported.
  '''npt_3f9a2c1d8b7e6f5a\.(Zm9vYmFyYmF6cXV1eHF1dXhmb29iYXJiYXo|foobarbazquuxquuxfoobarbaz)''',
  '''npt_8d1c4b7a2e9f6035\.(cXV1eGZvb2JhcmJhenF1dXhmb29iYXJiYXo|quuxfoobarbazquuxfoobarbaz)''',
  '''npt_0123456789abcdef\.c2VjcmV0LXZlcmlmaWVyLXZhbHVl''',
  '''npt_test_0123456789(abcdefSECRET)?''',

  # An unsigned JWT, header {"alg":"none"}. The attestation tests use several
  # as attack fixtures: a metadata file claiming no signature must be refused.
  # A token with no signature carries no key material by construction, so it is
  # allowed by its header rather than by the file it sits in, and a genuinely
  # signed token appearing anywhere is still reported.
  '''eyJhbGciOiJub25lIn0\.[A-Za-z0-9_-]*\.?''',
]

# Key material in the deployment examples is a named placeholder rather than a
# value, so the file paths are listed for those specific names only.
[[rules]]
id = "n0passtemps-placeholder-key-material"
description = "Placeholder key material in the shipped deployment examples"
regex = '''REPLACE_WITH_(BASE64_OF_32_RANDOM_BYTES|OUTPUT_OF_WIZARD_PEPPER|THE_PEM_FILE_CONTENTS)'''
[rules.allowlist]
description = "These are instructions to the operator, not values"
regexTarget = "match"
regexes = ['''REPLACE_WITH_''']
