  /v1/totp/{subject_ref}/enrol:
    parameters:
      - $ref: "#/components/parameters/SubjectRef"
    post:
      tags: [TOTP]
      operationId: enrolTOTP
      summary: Issue a TOTP secret.
      description: |
        Requires an API key that holds the `totp` scope, or an unrestricted
        key.

        The secret is disclosed here and nowhere else. Every later route reports
        only whether enrolment is confirmed.

        The secret is not usable for authentication until the user proves they
        can generate a code from it, which is what the confirm route is for.
        Treating an unconfirmed secret as live would let a failed enrolment
        weaken the account: the user would believe they had no second factor
        while one existed that they could not produce codes for.

        The account label inside `provisioning_uri` is the internal
        `subject_id`, not the reference the application supplied, because the
        URI ends up as a QR code and inside the user's authenticator
        application.

        Takes no body.
      security:
        - apiKey: []
      responses:
        "201":
          description: The secret, awaiting confirmation.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrolResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/CeremonyFailed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/Throttled"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/totp/{subject_ref}/enrol/confirm:
    parameters:
      - $ref: "#/components/parameters/SubjectRef"
    post:
      tags: [TOTP]
      operationId: confirmTOTP
      summary: Confirm a TOTP enrolment with one code.
      description: |
        Requires an API key that holds the `totp` scope, or an unrestricted
        key.

        Activates the pending secret. An enrolment left unconfirmed past its
        window is refused with `409` rather than accepted late, so a secret
        shown to a user long ago cannot be activated by someone who later
        obtained it. The default window is fifteen minutes.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: The secret is confirmed and usable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPConfirmResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/CeremonyFailed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            There is no enrolment awaiting confirmation, the enrolment has
            expired, or it is no longer awaiting confirmation.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/Throttled"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/totp/{subject_ref}/verify:
    parameters:
      - $ref: "#/components/parameters/SubjectRef"
    post:
      tags: [TOTP]
      operationId: verifyTOTP
      summary: Authenticate a subject with a TOTP code.
      description: |
        Requires an API key that holds the `totp` scope, or an unrestricted
        key.

        On success the response carries a signed assertion whose `amr` claim is
        `["totp"]`.

        A subject with no confirmed secret is refused exactly as a wrong code
        is, so this route cannot be used to discover which subjects have TOTP
        enrolled.

        A code is single use. The accepted timestep is consumed by a
        compare-and-swap, so two requests presenting the same code inside one
        period cannot both succeed.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: The subject authenticated.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssertionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/CeremonyFailed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/Throttled"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/totp/{subject_ref}/enroll:
    parameters:
      - $ref: "#/components/parameters/SubjectRef"
    post:
      tags: [TOTP]
