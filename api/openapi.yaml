        Requires an API key that holds the `totp` scope, or an unrestricted
        key.

        An alias of `POST /v1/totp/{subject_ref}/enrol`, served by the same
        handler. The specification spelled it "enroll" and both spellings are
        served so a published integration does not break over an orthography
        choice.
      security:
        - apiKey: []
