openapi: 3.1.0

info:
  title: n0passtemps
  version: 1.1.0
  summary: On-premise passwordless authentication server.
  description: |
    n0passtemps authenticates the end users of an integrating application with
    WebAuthn, TOTP and single-use recovery codes. It is deployed on premise and
    is called server to server: the browser talks to the integrating
    application, and the integrating application talks to this service with an
    API key.

    # Two authenticated surfaces

    `/v1` is the surface an integrating application calls. Every route on it
    requires an API key. It is not anonymous: an unauthenticated registration
    route would let anyone enrol an authenticator against any subject.

    `/admin/v1` is the surface an operator calls. Every route on it requires an
    administrative token, carries a role check, and sits behind a network allow
    list configured on the server. The two credential kinds cannot be
    substituted for each other.

    Three routes carry no credential at all: the liveness probe and the two
    paths that serve the JWKS document. Both disclose only public information.
    A fourth unauthenticated case is not a route in this document: `OPTIONS`
    under `/v1/` is answered by the CORS middleware with `204` and no body,
    because a preflight request carries no credential by definition.

    # The two-round-trip ceremony flow

    Both WebAuthn ceremonies are two round trips, and the caller sits in the
    middle of them.

    1. The application calls the begin route
       (`/v1/webauthn/{subject_ref}/register` or
       `/v1/webauthn/{subject_ref}/assert`). The response carries a
       `challenge_id` and an `options` object.
    2. The application passes `options` to the browser, which hands it to
       `navigator.credentials.create()` or `navigator.credentials.get()`. The
       browser returns a `PublicKeyCredential`.
    3. The application calls the matching complete route with the
       `challenge_id` from step 1 and that credential, **forwarded verbatim**,
       as `credential`.

    The credential response must not be reshaped, re-keyed or partially
    transcribed on the way through. The service parses it with a WebAuthn
    library, and a field dropped in transit is a field the library cannot use
    to verify the signature. The one transformation the browser code has to
    perform is the `ArrayBuffer` to base64url conversion that WebAuthn's JSON
    form requires, and back again for the fields the browser expects as binary;
    `examples/node/register.html` shows both directions.

    Ceremony state lives in the database, keyed by `challenge_id`. The caller
    never holds the expected challenge, the expected user handle or the
    user-verification requirement, so it cannot alter them between the two
    halves. A challenge is single use and expires.

    # What a successful ceremony returns

    A completed assertion, a verified TOTP code and a consumed recovery code
    all return an `assertion`: a compact JWS (RFC 7515) signed with Ed25519
    under the `EdDSA` algorithm of RFC 8037, carrying JWT claims (RFC 7519).
    The integrating application verifies it offline against the public key
    published at `/v1/.well-known/jwks.json` and then issues its own session.
    A verifier must pin both `iss` and `aud`; `aud` is the identifier of the
    API key the ceremony was performed for.

    Assertions are short lived, sixty seconds by default. They prove a ceremony
    completed moments ago and are meant to be exchanged immediately.

    # API key scopes

    An API key may be restricted to named families of `/v1` routes. The scopes
    are `subjects`, `webauthn`, `totp`, `recovery`, `health` and `tickets`, and
    each `/v1` route states the one it needs. A key minted with an empty scope list is
    unrestricted and reaches every family; the minting response says so in
    `unrestricted`, so that an unrestricted key is a visible choice. A key
    calling outside its scopes is answered `403` with
    `urn:n0passtemps:error:forbidden`, and the attempt is audited as
    `api_key.rejected`.

    Every request that presents a valid, in-scope API key is counted against
    `throttle.max_requests_per_key`, on every `/v1` route that takes a key and
    whether or not the route records an authentication outcome. Once the limit
    is reached the key is answered `429` until the window moves on.

    # Dual approval

    With `features.dual_approval` on, the operations named in
    `features.dual_approval_operations` are held for a second administrator.
    Four routes can be held:

    | route | operation | what the approval is bound to |
    | --- | --- | --- |
    | `POST /admin/v1/subjects/{subject_id}/erasure` | `subject.erase` | `subject_id`, `reason` |
    | `POST /admin/v1/admin-tokens` | `admin_token.create` | `name`, `role` |
    | `POST /admin/v1/subjects/{subject_id}/credentials/revoke-all` | `credential.revoke_bulk` | `subject_id`, `reason` |
    | `POST /admin/v1/kek/rewrap` | `kek.rotate` | the fixed action `rewrap` |

    An approval is a capability the requester redeems, not a job the service
    runs on the approver's behalf. The flow is three requests:

    1. The requester calls the route. Nothing is performed. The answer is a
       `202` problem document of type
       `urn:n0passtemps:error:approval-required` whose `detail` names the
       approval request identifier.
    2. A different administrator calls
       `POST /admin/v1/approvals/{approval_id}/approve`. That records the
       decision and performs nothing either. The requester cannot decide their
       own request.
    3. The original requester repeats the identical request with the header
       `X-Approval-Id: <approval_id>`. Only this request runs the operation,
       and its result, for instance a freshly minted token, goes to the
       administrator who asked for it.

    A redemption is accepted only when the approval names the same operation,
    was raised by the administrative token now redeeming it, is in the
    `approved` state, has not passed `expires_at` (set from
    `features.approval_ttl` when the request was queued), and carries the same
    bound payload as the request that was approved. Every refusal is the same
    `403` with no detail, so the route cannot be used to probe for another
    administrator's approvals; the reason is audited as `approval.rejected`.
    A header that is not a UUID is a `400`.

    An approval is spent exactly once, by a conditional update from `approved`
    to `executed` that has one winner under concurrent redemption. It is
    claimed before the operation runs. If the operation then fails, the
    approval is spent anyway and a new request is needed: failing closed costs
    a repeated request, where failing open would let one approval run an
    operation twice.

    One limitation. The bound payload of `admin_token.create` is `name` and
    `role` only. `expires_in_days` is not part of it, so the redeeming request
    may carry a different lifetime from the one the approver saw.

    The header is ignored on every other route, and on these four when dual
    approval is off or the operation is not in
    `features.dual_approval_operations`.

    # Error bodies

    Every refusal is an RFC 9457 problem document with the media type
    `application/problem+json`. The `type` member is a stable
    `urn:n0passtemps:error:*` identifier a client can branch on.

    Titles and types describe a class of failure and never the specific reason
    one request was refused. Every WebAuthn, TOTP and recovery-code failure
    returns the same `urn:n0passtemps:error:ceremony-failed` body with no
    detail, so a caller cannot tell a wrong signature from an expired challenge
    from an unknown credential. The real reason is logged and audited.

    When the credential store cannot be reached, an authenticated route answers
    `503` with `urn:n0passtemps:error:unavailable` rather than `401`. The
    credential was not examined, so nothing is audited as a rejection, and a
    client should retry rather than discard its key.

    # Headers

    Every response carries `X-Request-Id`. A client-supplied value is accepted
    and echoed when it is short and alphanumeric, otherwise the service assigns
    one itself.
    It is the identifier to quote in a support exchange, and it appears in the
    problem body as `request_id`.

    A throttled response carries `Retry-After` in seconds, mirrored in the body
    as `retry_after_seconds`.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: n0passtemps repository
    url: https://github.com/Socold/n0passtemps

servers:
  - url: http://127.0.0.1:8080
    description: |
      The default listening address of an unconfigured build. It is plain HTTP
      and bound to the loopback interface, which is appropriate for development
      and for a deployment that terminates TLS in a reverse proxy in front of
      this process.
  - url: "{scheme}://{host}:{port}"
    description: A deployment at an operator-chosen address.
    variables:
      scheme:
        default: https
        enum:
          - https
          - http
        description: |
          Plain HTTP is accepted only where TLS is terminated by a trusted
          reverse proxy on the same host.
      host:
        default: n0passtemps.internal
      port:
        default: "8443"

tags:
  - name: Health
    description: Liveness and the detailed component report.
  - name: Keys
    description: The public keys that verify an assertion.
  - name: Subjects
    description: Resolving an application's user reference to a subject.
  - name: WebAuthn
    description: The registration and assertion ceremonies.
  - name: TOTP
    description: Time-based one-time password enrolment and verification.
  - name: Recovery
    description: Single-use recovery codes.
  - name: Enrolment tickets
    description: |
      Single-use secrets that permit exactly one WebAuthn registration. They
      never produce a signed assertion, and delivering them is the integrating
      application's responsibility.
  - name: Administration
    description: Operator routes under /admin/v1.

paths:
  /v1/health:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Liveness probe.
      description: |
        Answers whether this process can serve traffic. It touches the database,
        because a process that is running but cannot reach its store cannot
        authenticate anyone and should be taken out of rotation.

        The version, the keyring state, whether rotation is overdue and the
        certificate expiry are all behind authentication. Handed to an
        unauthenticated caller, that set is a list of the software to look up
        advisories for and a statement of which maintenance has been neglected.
      security: []
      responses:
        "200":
          description: The process can serve traffic.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
              examples:
                alive:
                  value:
                    status: ok
        "503":
          description: |
            The store is not reachable. The body carries `status: error`.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
              examples:
                down:
                  value:
                    status: error

  /v1/health/detail:
    get:
      tags: [Health]
      operationId: getHealthDetail
      summary: Detailed component report.
      description: |
        Requires an API key that holds the `health` scope, or an unrestricted
        key.

        The authenticated report. It names the build, the state of the key
        encryption keyring, whether rotation is overdue, the certificate expiry
        when TLS is terminated in process, the audit chain head and the count of
        open alerts by severity.

        The same report is served at `GET /admin/v1/health` for an operator
        holding an administrative token.
      security:
        - apiKey: []
      responses:
        "200":
          description: The report.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/Throttled"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/.well-known/jwks.json:
    get:
      tags: [Keys]
      operationId: getJWKS
      summary: The JWK Set that verifies assertions.
      description: |
        Publishes the public key of the assertion signing key as a JWK Set
        (RFC 7517), restricted to the OKP members of RFC 8037 section 2.

        It is unauthenticated because the contents are public keys, and because
        an integrating application has to be able to fetch it in order to verify
        an assertion offline. That is the point of returning a detached
        signature rather than a bare status code.

        During a rotation the operator serves the union of the outgoing and
        incoming sets, and the `kid` header of each assertion selects between
        them. The response is cacheable for five minutes.
      security: []
      responses:
        "200":
          description: The JWK Set.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              description: Fixed at `public, max-age=300`.
              schema:
                type: string
          content:
            application/jwk-set+json:
              schema:
                $ref: "#/components/schemas/JWKSet"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/jwks.json:
    get:
      tags: [Keys]
      operationId: getJWKSShort
      summary: The JWK Set, at the shorter path.
      description: |
        Identical to `GET /v1/.well-known/jwks.json`. Both paths are served
        because the well-known prefix is what the JWKS convention specifies,
        while integrations frequently look for the shorter form.
      security: []
      responses:
        "200":
          description: The JWK Set.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              description: Fixed at `public, max-age=300`.
              schema:
                type: string
          content:
            application/jwk-set+json:
              schema:
                $ref: "#/components/schemas/JWKSet"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/subjects:
    post:
      tags: [Subjects]
      operationId: resolveSubject
      summary: Resolve a reference to a subject, creating it if needed.
      description: |
        Requires an API key that holds the `subjects` scope, or an unrestricted
        key.

        Idempotent. An integrating application may call this on every login
        rather than tracking whether it has registered the user here before.

        The response never echoes `subject_ref`. The caller already has it, and
        echoing it would put it into a response body that an intermediary may
        cache or log.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubjectRequest"
      responses:
        "200":
          description: The subject, whether it already existed or was created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/Throttled"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/subjects/{subject_ref}:
    parameters:
      - $ref: "#/components/parameters/SubjectRef"
    get:
      tags: [Subjects]
      operationId: getSubject
      summary: Read a subject's enrolled factors.
      description: |
        Requires an API key that holds the `subjects` scope, or an unrestricted
        key.

        Used to decide what to offer a returning user: a subject with no
        credential needs registration, one with credentials needs an assertion.

        Unlike the ceremony routes, this one distinguishes an unknown subject
        with a `404`, because it is a lookup rather than an authentication
        attempt.
      security:
        - apiKey: []
      responses:
        "200":
          description: The subject.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/Throttled"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/webauthn/{subject_ref}/register:
    parameters:
      - $ref: "#/components/parameters/SubjectRef"
    post:
      tags: [WebAuthn]
      operationId: beginRegistration
      summary: Begin a registration ceremony.
      description: |
        Requires an API key that holds the `webauthn` scope, or an unrestricted
        key.

        Round trip one of two. The subject must already exist; call
        `POST /v1/subjects` first. Creating it here implicitly would let a
        caller holding a valid key populate the database with subjects by
        starting ceremonies it never finishes.

        The subject's existing credentials are excluded in the returned
        options, so an authenticator already enrolled cannot be enrolled twice
        and the browser can tell the user why.

        The body is optional; a request with no body is accepted.
      security:
        - apiKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBeginRequest"
      responses:
        "200":
          description: The challenge and the creation options.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeginRegistrationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/CeremonyFailed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/Throttled"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/webauthn/{subject_ref}/register/complete:
    parameters:
      - $ref: "#/components/parameters/SubjectRef"
    post:
      tags: [WebAuthn]
      operationId: completeRegistration
      summary: Complete a registration ceremony.
      description: |
        Requires an API key that holds the `webauthn` scope, or an unrestricted
        key.

        Round trip two of two. `challenge_id` is the value from the begin call
        and `credential` is the browser's `PublicKeyCredential`, forwarded
        verbatim.

        A first credential is the point at which recovery codes become useful,
        so the response reports how many the subject holds. They are not issued
        automatically, because that would mean returning secrets in a response
        the caller did not ask for and which can only be shown once.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CeremonyCompleteRequest"
      responses:
        "201":
          description: The authenticator is enrolled.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterCompleteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/CeremonyFailed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/Throttled"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/webauthn/{subject_ref}/assert:
    parameters:
      - $ref: "#/components/parameters/SubjectRef"
    post:
      tags: [WebAuthn]
      operationId: beginAssertion
      summary: Begin an authentication ceremony.
      description: |
        Requires an API key that holds the `webauthn` scope, or an unrestricted
        key.

        Round trip one of two. Takes no body.

        An unknown subject, an inactive subject and a subject with no registered
        authenticator are all refused the same way as a failed ceremony, so this
        route cannot be used to test whether a given person has an account.
      security:
        - apiKey: []
      responses:
        "200":
          description: The challenge and the request options.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeginAssertionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/CeremonyFailed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/Throttled"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/webauthn/assert/discoverable:
    post:
      tags: [WebAuthn]
      operationId: beginDiscoverableAssertion
      summary: Begin an authentication ceremony without naming the subject.
      description: |
        Requires an API key that holds the `webauthn` scope, or an unrestricted
        key.

        Round trip one of two for usernameless sign-in. There is no
        `subject_ref` in the path, because the point of the route is that the
        caller does not yet know who is signing in. The options carry no
        `allowCredentials`, which is what makes the browser offer whichever
        passkeys the authenticator holds for this relying party.

        `userVerification` is always `required` here, whatever
        `webauthn.user_verification` is configured to. A named ceremony is
        already scoped to a subject the caller chose, so possession of that
        subject's authenticator answers a question somebody asked. This
        ceremony is scoped to nothing: the authenticator alone decides which
        account the response is for, so a possession-only response would let a
        found or stolen passkey sign in as its owner with nothing else needed.
        A deployment whose authenticators cannot verify a user cannot offer
        this route.

        Only the per-network and per-key limits apply, because no subject is
        known yet. The challenges are single use, short lived and useless
        without an authenticator holding a matching credential, so those limits
        bound the cost of issuing them.
      security:
        - apiKey: []
      responses:
        "200":
          description: A ceremony was started. Pass the options to the browser.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeginAssertionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/Throttled"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/webauthn/assert/discoverable/complete:
    post:
      tags: [WebAuthn]
      operationId: completeDiscoverableAssertion
      summary: Complete a ceremony begun without naming the subject.
      description: |
        Requires an API key that holds the `webauthn` scope, or an unrestricted
        key.

        Round trip two of two for usernameless sign-in. The response reports
        which subject the credential turned out to belong to, in `subject_id`,
        alongside the same signed assertion the named route returns.

        The subject is resolved from the credential identifier and never from
        the user handle. Both arrive in the same client-supplied response, but
        the credential identifier selects a stored public key which then has to
        verify the signature, whereas the handle is only a value in a JSON
        document. The handle is compared against the one this service derived
        for the resolved subject, and a mismatch refuses the ceremony.

        A refusal is never recorded against a subject, because a failed
        ceremony has not established which subject it was for. It counts
        against the calling key and the source network only.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CeremonyCompleteRequest"
      responses:
        "200":
          description: The subject authenticated, and the response names them.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssertionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/CeremonyFailed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/Throttled"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/webauthn/{subject_ref}/assert/complete:
    parameters:
      - $ref: "#/components/parameters/SubjectRef"
    post:
      tags: [WebAuthn]
      operationId: completeAssertion
      summary: Complete an authentication ceremony.
      description: |
        Requires an API key that holds the `webauthn` scope, or an unrestricted
        key.

        Round trip two of two. On success the response carries the signed
        assertion to verify against the JWKS document.

        `signals` reports conditions worth surfacing that did not refuse the
        authentication. A signature counter that failed to advance is the
        documented signal for two copies of a credential private key in use,
        but many authenticators legitimately report a constant zero and a
        synchronised platform authenticator does the same, so it is reported
        rather than enforced. An application may decide to step up on it.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
