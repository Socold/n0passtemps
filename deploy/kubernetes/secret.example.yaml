# EXAMPLE ONLY. Every value below is a placeholder and must be replaced before
# this file is applied. Do not commit the filled-in version: rename it, keep it
# out of the repository, or replace it entirely with an external secret manager.
#
# The keyring is generated once with:
#   n0passtemps-wizard kek init
# Losing every copy of it makes the secrets sealed under it unrecoverable, so
# back it up outside the cluster before the first start.
apiVersion: v1
kind: Secret
metadata:
  name: n0passtemps-secrets
  namespace: n0passtemps
  labels:
    app.kubernetes.io/name: n0passtemps
type: Opaque
stringData:
  # Mounted as a file at /etc/n0passtemps/kek/keyring.json, which is outside the
  # data volume on purpose: the server refuses a keyring that resolves inside a
  # configured data directory, because a key kept on the same volume as the
  # ciphertext it protects is copied together with it.
  #
  # Replace both base64 values with the output of "n0passtemps-wizard kek init".
  # Each is the standard base64 encoding of 32 random bytes.
  keyring.json: |
    {
      "current": 1,
      "keys": {
        "1": "REPLACE_WITH_BASE64_OF_32_RANDOM_BYTES"
      }
    }

  # PostgreSQL connection string. Remove this key to use the SQLite store, in
  # which case the data volume in deployment.yaml must become a PersistentVolume
  # instead of an emptyDir.
  database-url: "postgres://REPLACE_USER:REPLACE_PASSWORD@REPLACE_HOST:5432/n0passtemps?sslmode=verify-full"
