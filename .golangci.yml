# Targets golangci-lint v2. The schema changed between v1 and v2, so a v1
# binary rejects this file; the pinned version is in the Makefile.
version: "2"

run:
  # Long enough for a cold run on a runner without a warm build cache.
  timeout: 5m
  # Test files are linted too. Most of the crypto and store invariants are
  # asserted there, and an unchecked error in a test hides a passing assertion.
  tests: true

linters:
  # Nothing implicit: the set below is the set that runs, so adding a linter is
  # a visible decision and a golangci-lint upgrade cannot quietly enable one.
  default: none
  enable:
    # An ignored error in this project means an unverified assertion, a
    # keyring left unzeroized or a transaction left open.
    - errcheck
    - govet
    - staticcheck
    - unused
    # Security patterns: weak randomness, hardcoded credentials, unhandled
    # file permissions. The keyring mode check in internal/crypto/kek is the
    # kind of rule this backs up.
    - gosec
    - revive
    - ineffassign
    - unconvert
    - misspell
    # An unclosed HTTP response body leaks a connection from the pool, which
    # shows up as a slow admin interface long after the offending call.
    - bodyclose
    # Errors are compared with errors.Is and wrapped with %w, not matched on
    # their message text.
    - errorlint
    - gocritic
    # Returning nil after checking a non-nil error swallows a database or
    # crypto failure and reports success.
    - nilerr
    # Rows and statements not closed hold a connection for the lifetime of the
    # process; rows.Err() not checked turns a truncated result set into a
    # silently short answer.
    - sqlclosecheck
    - rowserrcheck
    # Complexity budget, see the settings below.
    - gocyclo
    - lll

  settings:
    errcheck:
      # A discarded error from a type assertion is as much a bug as a
      # discarded return value.
      check-type-assertions: true
      # "_ = f()" is left to gosec instead, which is stricter about it. G104
      # under .gosec.json requires "// #nosec G104 -- reason" on the line, so a
      # deliberately dropped error has to carry a written justification rather
      # than merely being assigned to the blank identifier. Checking it here as
      # well reported the same lines a second time with no reason attached.
      check-blank: false
      # database/sql documents Rows.Close as returning the error encountered
      # during iteration, which is the same error Rows.Err reports. Every
      # deferred Close in this repository sits in a function that checks Err
      # after the loop, which is where a truncated result set is caught and
      # turned into a returned error. Wrapping each of those Close calls in a
      # closure to discard an error that has already been reported would add
      # fourteen closures that say nothing. This exclusion was granted after
      # checking that all fourteen sites do have the matching Err check, and it
      # is worth re-checking if the count moves.
      exclude-functions:
        - (*database/sql.Rows).Close

    govet:
      enable:
        # A shadowed err is the standard way a handled error becomes an
        # unhandled one.
        - shadow

    staticcheck:
      # SA is the set that finds bugs. ST is a style guide this project does
      # not follow (it prescribes American spelling and a comment form the
      # house style differs from), and QF is a catalogue of editor
      # quick-fixes, not findings: "could use a tagged switch" and "could
      # remove an embedded field from a selector" are preferences.
      checks:
        - "all"
        - "-ST*"
        - "-QF*"

    errorlint:
      # The project wraps its own sentinel and attaches the underlying error as
      # detail: fmt.Errorf("%w: %v", ErrCeremonyFailed, err). The %w is what
      # errors.Is matches on; the %v is deliberate, so that a third-party
      # error's own type and Is method never join the chain a caller matches
      # against. This check reads the %v alone and reports all fourteen of
      # them. The comparison and type-assertion checks stay on, because those
      # do catch a real mistake.
      errorf: false

    gosec:
      config:
        # golangci-lint runs its own embedded gosec and does not read
        # .gosec.json, so the entropy thresholds have to be repeated here or
        # the 21 identifier-shaped constants that "make sec" clears are
        # reported again. The values and the measurement behind them are
        # documented in CONTRIBUTING.md; change both together.
        G101:
          entropy_threshold: "70.0"
          per_char_threshold: "4.25"

    gocyclo:
      # Budget: 15 branches per function. The WebAuthn assertion path and the
      # config loader sit near it; anything above is a sign the function is
      # doing two jobs and should be split rather than annotated.
      min-complexity: 15

    lll:
      # Budget: 120 columns. Wide enough for a struct tag, a wrapped error with
      # context and a table-driven test case on one line; narrow enough to read
      # two files side by side and to review a diff without horizontal
      # scrolling. gofmt does not wrap lines, so this is the only thing that
      # keeps them bounded.
      line-length: 120
      tab-width: 4

    misspell:
      # The prose in this repository is British throughout: enrolment,
      # authorise, cancelled, behaviour, serialisation. Under the US locale the
      # linter reported 182 of them as errors, which is the setting being wrong
      # about the house style rather than the house style being wrong.
      locale: UK
      # "unauthorized" is not prose here. It is the name of an HTTP status in
      # the standard library and the RFC 9457 problem type on the wire
      # (urn:n0passtemps:error:unauthorized), which every SDK matches on.
      # Anglicising it would be a breaking change to the API.
      ignore-rules:
        - unauthorized

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        # Fires on the guard-clause style used throughout the store and handler
        # code, where the early return is the point.
        - ifElseChain

    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: context-as-argument
        - name: context-keys-type
        - name: indent-error-flow
        - name: range-val-address
        - name: unreachable-code
        - name: unused-parameter
        - name: var-naming

  exclusions:
    # Generated files carry the upstream generator's style, which is not the
    # project's to fix.
    generated: lax
    rules:
      # Tests deliberately use weak keys, fixed nonces and hardcoded sample
      # secrets to pin known-answer results, and table-driven cases run long.
      # Correctness rules stay on; style and security rules that only make
      # sense for production code do not.
      - path: _test\.go
        linters:
          - gosec
          - lll
          - gocyclo
          - bodyclose

      # Fingerprint(x) != Fingerprint(x) is the determinism assertion itself,
      # and the U+009B literal is the input a test feeds the log sanitiser on
      # purpose. Both read to a linter as a mistake and to a reader as the
      # point of the test.
      - path: ^internal/(logging|subject)/.*_test\.go$
        linters:
          - staticcheck
        text: "(SA4000|ST1018)"

      # originMatchesRPID returns nil on a parse failure because
      # validateOrigin has already reported it; returning a second error for
      # one fault would make the configuration report contradict itself. The
      # two in deploy_test.go are the same shape.
      - path: ^internal/config/
        linters:
          - nilerr

      # Both of these open a result set inside a loop, so their rows.Close
      # calls sit on the error paths of the loop body. "defer" there would
      # stack one close per iteration until the function returned, which is
      # the bug this rule exists to prevent rather than the fix for it. The
      # chain verifier pages; the backup census walks one sealed column at a
      # time.
      - path: ^(internal/store/sqlite/audit|cmd/n0passtemps-wizard/verify)\.go$
        linters:
          - sqlclosecheck

      # recover() yields an "any", and net/http panics with the
      # http.ErrAbortHandler value itself. errors.Is is for unwrapping an
      # error chain, which a panic value does not have.
      - path: ^internal/api/middleware\.go$
        linters:
          - errorlint
        text: "comparing with =="

      # The wizard writes config.toml, docker-compose.yml and .env with modes
      # the operator then tightens, and prints to stdout by design. gosec reads
      # both as findings.
      - path: ^cmd/n0passtemps-wizard/
        linters:
          - gosec
        text: "G(302|304|306)"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/Socold/n0passtemps

issues:
  # No cap. A truncated report makes the second run look like an improvement
  # when it is the same code.
  max-issues-per-linter: 0
  max-same-issues: 0
  # Only findings introduced by the change under review would be reported if
  # this were true, which lets existing problems stay indefinitely.
  new: false
